name: weekly-collect

on:
  schedule:
    # Wed 21:23 UTC = 2:23pm PDT / 1:23pm PST. Off-hour minute dodges the :00
    # scheduled-workflow stampede (runs at '0 22' started ~50min late on 7/29 and
    # 8/5); even a worst-case delay lands well before the Wednesday digest session.
    - cron: '23 21 * * 3'
    # In-season Sundays (Sep–Dec) 14:30 UTC = 7:30am PDT / 6:30am PST —
    # news-mode collection (Thu→Sun window) for the 8:30am PT Sunday Brief.
    - cron: '30 14 * 9-12 0'
    # Inactives pull ~11:45am ET (official inactives drop 11:30am ET).
    # Month-split crons track the US DST change: 15:45 UTC = 11:45 EDT
    # (Sep–Oct), 16:45 UTC = 11:45 EST (Nov–Dec).
    - cron: '45 15 * 9,10 0'
    - cron: '45 16 * 11,12 0'
  workflow_dispatch: {}
  # Manual poke reachable from Claude sandbox sessions: the sandbox git proxy
  # allows authenticated pushes but blocks api.github.com, so workflow_dispatch
  # can't be called from there. Bumping .github/collect-now fires a collection
  # (mode is computed from the day, same as a dispatch). Data commits carry
  # [skip ci] and the paths filter is exact, so this cannot self-loop.
  push:
    branches: [main]
    paths: ['.github/collect-now']

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Determine mode (Sun AM = sunday, Sun midday = inactives)
        id: mode
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            if [ "$(date -u +%H)" -ge 15 ]; then MODE=inactives; else MODE=sunday; fi
          else
            MODE=weekly
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running in $MODE mode"

      - name: Collect + score tweets
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: python collector.py

      - name: Render fallback digest
        run: python render_digest.py

      - name: Commit results
        run: |
          git config user.name "ff-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data digest
          git commit -m "weekly collection $(date -u +%F) [skip ci]" || echo "nothing new"
          git push
