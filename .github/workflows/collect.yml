name: weekly-collect

on:
  schedule:
    # Wed 22:00 UTC = 3:00pm PDT / 2:00pm PST — finishes well before the
    # Wednesday 5pm PT Claude session that builds the digest.
    - cron: '0 22 * * 3'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect + score tweets
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python collector.py

      - name: Render fallback digest
        run: python render_digest.py

      - name: Commit results
        run: |
          git config user.name "ff-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data digest
          git commit -m "weekly collection $(date -u +%F) [skip ci]" || echo "nothing new"
          git push
