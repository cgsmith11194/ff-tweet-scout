# FF Tweet Scout — sources & tuning
# Edit freely; collector.py reads this on every run.

window_days: 7

apify:
  # kaitoeasyapi = $0.25 per 1,000 tweets, pay-per-result
  # (swap for apidojo~tweet-scraper if you prefer; collector normalizes both)
  actor: kaitoeasyapi~twitter-x-data-tweet-scraper-pay-per-result-cheapest
  query_type: Latest        # Latest | Top
  poll_seconds: 15
  timeout_minutes: 20

