account_query:
  handles_per_query: 9        # X search ~512-char query limit
  min_faves: 0                # no floor for followed accounts
  max_items: 1400             # cap across all account batches per run

# Pattern searches — catch the ~40% of picks from one-off accounts.
# {since}/{until} are injected by collector.py.
searches:
  - name: routes_targets
    query: '("yards per route run" OR YPRR OR "targets per route" OR "target share" OR "route share" OR "route participation") lang:en'
    min_faves: 120
    max_items: 120
  - name: only_first_since
    query: '(NFL OR fantasy) ("first player since" OR "only player in" OR "first rookie since" OR "in NFL history" OR "Super Bowl era") lang:en'
    min_faves: 250
    max_items: 120
  - name: rushing_efficiency
    query: '("yards after contact" OR "missed tackles forced" OR "rush yards over expected" OR RYOE OR "success rate" OR "explosive run") (RB OR rushing OR carries) lang:en'
    min_faves: 120
    max_items: 100
  - name: epa_qb
    query: '("EPA per" OR "EPA/play" OR CPOE OR "completion percentage over expected" OR "off target rate" OR "pressure rate") (QB OR quarterback OR dropback) lang:en'
    min_faves: 120
    max_items: 100
  - name: usage_snaps
    query: '("snap share" OR "snap rate" OR "route rate" OR "1st read" OR "first read") (WR OR TE OR RB OR target) lang:en'
    min_faves: 120
    max_items: 100
  - name: redzone_goalline
    query: '("inside the 5" OR "inside the 10" OR "end zone targets" OR "goal line carries" OR "red zone targets") lang:en'
    min_faves: 100
    max_items: 80
  - name: pace_scheme
    query: '("situation-neutral pace" OR "neutral pace" OR "pass rate over expectation" OR PROE OR "play-action rate" OR "pace of play") NFL lang:en'
    min_faves: 80
    max_items: 80
  - name: fantasy_pace_market
    query: '("fantasy points per game" OR "PPR points per game" OR "on pace for" OR "priced as" OR ADP) (WR OR RB OR TE OR QB) lang:en'
    min_faves: 150
    max_items: 120

# Sunday Brief mode (MODE=sunday): Thu->Sun window, news lens for the
# in-season Sunday AM edition. Injury/designation news is BOOSTED here,
# not penalized.
sunday:
  window_days: 3
  searches:
    - name: designations
      query: '("ruled out" OR questionable OR doubtful OR "will not play" OR "expected to play" OR "game-time decision" OR inactive OR activated OR elevated) (NFL OR fantasy) lang:en'
      min_faves: 300
      max_items: 150
    - name: practice_reports
      query: '("did not practice" OR "limited practice" OR "full practice" OR "injury report" OR DNP) NFL lang:en'
      min_faves: 150
      max_items: 80
    - name: line_moves
      query: '("opened at" OR "moved to" OR "now favored" OR "line move" OR "total dropped" OR "total moved") (NFL OR spread OR total) lang:en'
      min_faves: 100
      max_items: 60
  # Inactives Addendum pull — Sundays ~11:45am ET (official inactives drop
  # 11:30am ET, 90 min before early kickoff). Light pass: tier1 + news
  # accounts, trailing ~7 hours, hour-precise window.
  inactives:
    window_hours: 7
    keep_top: 80
    searches:
      - name: inactives_lists
        query: '(inactives OR "officially inactive" OR "officially active" OR "is active" OR "will play" OR "not expected to play" OR "surprise inactive") NFL lang:en'
        min_faves: 50
        max_items: 120

odds:
  espn_snapshot: true         # keyless spread/OU snapshot each run -> data/odds-DATE.json

output:
  keep_top: 160               # candidates written to data/latest.json
  min_score: 25               # floor for analysis/cold-water candidates
  min_score_fun: 8            # fun bucket is judged on humor, not stat density
  min_score_news: 10          # sunday mode: "Player X OUT" is short by nature
